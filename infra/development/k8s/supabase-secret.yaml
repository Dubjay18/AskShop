# Kubernetes Secret to hold Supabase credentials for local development
# Replace the placeholder values with your actual SUPABASE_URL and SUPABASE_KEY or use
# `kubectl create secret generic supabase --from-literal=SUPABASE_URL=<url> --from-literal=SUPABASE_KEY=<key>`
apiVersion: v1
kind: Secret
metadata:
  name: supabase
type: Opaque
stringData:
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_KEY: "your-service-role-key"
