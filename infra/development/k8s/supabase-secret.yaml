# Kubernetes Secret to hold Supabase credentials for local development
# 
# ⚠️ WARNING: DO NOT PUT ACTUAL CREDENTIALS IN THIS FILE
# This file should contain only placeholders and be committed to version control
#
# Recommended approach to avoid exposing credentials:
#
# 1. Create a .env file (copy from .env.example) with your actual credentials:
#    SUPABASE_URL=https://your-real-project.supabase.co
#    SUPABASE_KEY=your-real-service-role-key
#
# 2. Load the environment variables into Kubernetes:
#    source .env
#    ./scripts/load-env-to-k8s.sh
#
# This way your credentials stay on your local machine and aren't committed to git
#
apiVersion: v1
kind: Secret
metadata:
  name: supabase
type: Opaque
stringData:
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_KEY: "your-service-role-key"
